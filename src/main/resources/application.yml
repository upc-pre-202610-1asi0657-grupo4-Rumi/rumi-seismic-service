server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: rumi-seismic-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# This service owns seismiceventsdb (PostgreSQL). It has no persistent entities yet,
# so no connection is opened; these settings become spring.datasource when seismic
# events and risk indexes are persisted.
rumi:
  datasource:
    url: ${SEISMIC_DB_URL:jdbc:postgresql://localhost:5432/seismiceventsdb}
    username: ${SEISMIC_DB_USERNAME:postgres}
    password: ${SEISMIC_DB_PASSWORD:postgres}

resilience4j:
  circuitbreaker:
    instances:
      igpFeed:
        sliding-window-type: count_based
        sliding-window-size: 4
        minimum-number-of-calls: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
