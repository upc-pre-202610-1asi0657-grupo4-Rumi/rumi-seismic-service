server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: rumi-seismic-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  # This service owns seismiceventsdb (PostgreSQL).
  datasource:
    url: ${SEISMIC_DB_URL:jdbc:postgresql://localhost:5432/seismiceventsdb}
    username: ${SEISMIC_DB_USERNAME:postgres}
    password: ${SEISMIC_DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    # No migration tool yet: Hibernate keeps the schema up to date.
    hibernate:
      ddl-auto: update

rumi:
  igp:
    # Must return the JSON shape of IgpSeismicEventResponse (see README).
    latest-event-url: ${IGP_LATEST_EVENT_URL:http://localhost:8099/igp/latest-event}
    timeout: 5s

resilience4j:
  circuitbreaker:
    instances:
      igpFeed:
        sliding-window-type: count_based
        sliding-window-size: 4
        minimum-number-of-calls: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
